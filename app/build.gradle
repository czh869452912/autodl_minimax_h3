apply plugin: "com.android.application"

def frontendDir = file("../frontend")
def frontendDistDir = file("../frontend/dist")
def webAssetsDir = file("src/main/assets/web")
def npmCommand = System.getProperty("os.name").toLowerCase().contains("win") ? "npm.cmd" : "npm"

// Keep Android Studio/Gradle builds from embedding a stale WebView bundle.
tasks.register("buildFrontend", Exec) {
    workingDir frontendDir
    commandLine npmCommand, "run", "build"
    inputs.dir(new File(frontendDir, "src"))
    inputs.files(
        new File(frontendDir, "index.html"),
        new File(frontendDir, "package.json"),
        new File(frontendDir, "package-lock.json"),
        new File(frontendDir, "vite.config.ts"),
        new File(frontendDir, "tsconfig.json")
    )
    outputs.dir(frontendDistDir)
}

tasks.register("syncFrontendAssets", Sync) {
    dependsOn("buildFrontend")
    from frontendDistDir
    into webAssetsDir
}

android {
    namespace "com.example.autodlh3"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.autodlh3"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named("preBuild").configure {
    dependsOn("syncFrontendAssets")
}
