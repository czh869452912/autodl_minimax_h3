apply plugin: "com.android.application"

def frontendDir = file("../frontend")
def frontendDistDir = file("../frontend/dist")
def webAssetsDir = file("src/main/assets/web")
def npmCommand = System.getProperty("os.name").toLowerCase().contains("win") ? "npm.cmd" : "npm"
def frontendPackageJson = new File(frontendDir, "package.json")
def frontendPackageLock = new File(frontendDir, "package-lock.json")
def frontendNodeModules = new File(frontendDir, "node_modules")

// Dependencies are intentionally not checked into git. Restore them from the
// lockfile before invoking Vite so a fresh Android Studio checkout is buildable.
tasks.register("installFrontendDependencies", Exec) {
    workingDir frontendDir
    commandLine npmCommand, "ci", "--no-audit", "--no-fund"
    inputs.files(frontendPackageJson, frontendPackageLock)
    outputs.dir(frontendNodeModules)
}

// Keep Android Studio/Gradle builds from embedding a stale WebView bundle.
tasks.register("buildFrontend", Exec) {
    workingDir frontendDir
    commandLine npmCommand, "run", "build"
    dependsOn("installFrontendDependencies")
    ["src", "components", "hooks", "lib", "scripts"].each { sourceDir ->
        inputs.dir(new File(frontendDir, sourceDir))
    }
    inputs.files(
        frontendPackageJson,
        frontendPackageLock,
        new File(frontendDir, "index.html"),
        new File(frontendDir, "metadata.json"),
        new File(frontendDir, "components.json"),
        new File(frontendDir, "vite.config.ts"),
        new File(frontendDir, "tsconfig.json")
    )
    outputs.dir(frontendDistDir)
}

tasks.register("syncFrontendAssets", Sync) {
    dependsOn("buildFrontend")
    from frontendDistDir
    into webAssetsDir
}

android {
    namespace "com.example.autodlh3"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.autodlh3"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.11.0"
    implementation "androidx.media3:media3-ui:1.11.0"
}

tasks.named("preBuild").configure {
    dependsOn("syncFrontendAssets")
}
