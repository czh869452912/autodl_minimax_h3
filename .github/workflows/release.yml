name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish universal APK
    runs-on: ubuntu-latest
    environment: release
    env:
      APK_PATH: mobile/android/app/build/outputs/apk/release/AutoDL-H3-${{ github.ref_name }}-apk-universal.apk

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify tag belongs to main and matches app version
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          node <<'NODE'
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME.replace(/^v/, '');
          const app = JSON.parse(fs.readFileSync('mobile/app.json', 'utf8'));
          const gradle = fs.readFileSync('mobile/android/app/build.gradle', 'utf8');
          const packageJson = JSON.parse(fs.readFileSync('mobile/package.json', 'utf8'));
          const gradleVersion = gradle.match(/versionName\s+"([^"]+)"/)?.[1];
          for (const [name, value] of Object.entries({ tag, appVersion: app.expo.version, packageVersion: packageJson.version, gradleVersion })) {
            if (value !== tag) throw new Error(`${name}=${value} does not match tag v${tag}`);
          }
          NODE

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager_path="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          test -x "$sdkmanager_path"
          yes | "$sdkmanager_path" --licenses >/dev/null || true
          "$sdkmanager_path" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Decode release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTODL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/autodl-h3-release-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          test -s "$keystore"

      - name: Install JavaScript dependencies
        working-directory: mobile
        run: npm ci --legacy-peer-deps

      - name: Build signed universal APK
        working-directory: mobile/android
        env:
          AUTODL_UPLOAD_STORE_FILE: ${{ runner.temp }}/autodl-h3-release-upload.jks
          AUTODL_UPLOAD_STORE_PASSWORD: ${{ secrets.AUTODL_UPLOAD_STORE_PASSWORD }}
          AUTODL_UPLOAD_KEY_ALIAS: ${{ secrets.AUTODL_UPLOAD_KEY_ALIAS }}
          AUTODL_UPLOAD_KEY_PASSWORD: ${{ secrets.AUTODL_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Verify APK metadata, ABI coverage, and signature
        shell: bash
        run: |
          set -euo pipefail
          apk="mobile/android/app/build/outputs/apk/release/app-release.apk"
          version="${GITHUB_REF_NAME#v}"
          test -s "$apk"
          badging="$($ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$apk")"
          grep -E "package: name='com.example.autodlh3' versionCode='[0-9]+' versionName='${version}'" <<< "$badging"
          grep -F "native-code: 'arm64-v8a' 'armeabi-v7a' 'x86' 'x86_64'" <<< "$badging"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
          mkdir -p "$(dirname "$APK_PATH")"
          cp "$apk" "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^${GITHUB_REF_NAME}$" | head -n 1 || true)"
          if [[ -n "$previous_tag" ]]; then
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${GITHUB_REF_NAME}"
          else
            compare="https://github.com/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}"
          fi
          notes="$RUNNER_TEMP/release-notes.md"
          range="$GITHUB_REF_NAME"
          if [[ -n "$previous_tag" ]]; then range="${previous_tag}..${GITHUB_REF_NAME}"; fi
          fixes="$(git log --no-merges --pretty=format:'- %s (`%h`)' "$range" | grep -Ei '^- (fix|hotfix)(\(.+\))?:' || true)"
          improvements="$(git log --no-merges --pretty=format:'- %s (`%h`)' "$range" | grep -Eiv '^- (fix|hotfix)(\(.+\))?:' || true)"
          : > "$notes"
          if [[ -n "$fixes" ]]; then printf '## 修复\n%s\n\n' "$fixes" >> "$notes"; fi
          if [[ -n "$improvements" ]]; then printf '## 改进\n%s\n\n' "$improvements" >> "$notes"; fi
          printf '**Full Changelog**: %s\n' "$compare" >> "$notes"
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AutoDL H3 $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag
